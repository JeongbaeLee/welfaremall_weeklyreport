<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복지몰사업팀 주간보고</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ea; --line2:#eef0f3;
    --ink:#1d2330; --ink2:#4a5263; --muted:#8a92a3;
    --accent:#1f3a68; --accent-soft:#eef2f8; --danger:#b42318;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:1480px;margin:0 auto;padding:0 20px}

  /* top bar */
  .top{background:var(--card);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:24px;height:76px}
  .brand{font-weight:700;font-size:30px;letter-spacing:-.8px}

  /* 3단 레이아웃 */
  .layout{display:grid;grid-template-columns:236px minmax(0,1fr) 236px;gap:20px;align-items:start}
  .layout.no-side{grid-template-columns:minmax(0,1fr)}
  .layout.no-side .side{display:none}
  .side{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .panel-h h3{font-size:14px;margin:0}

  /* 달력 */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-nav b{font-size:14px}
  .cal-nav button{border:0;background:none;cursor:pointer;padding:2px 8px;border-radius:5px;color:var(--ink2);font-size:15px}
  .cal-nav button:hover{background:var(--line2)}
  table.cal{width:100%;border-collapse:separate;border-spacing:0 2px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
  .cal th{color:var(--muted);font-weight:500;padding:3px 0}
  .cal td{padding:5px 0;color:var(--ink)}
  .cal td.out{color:#c4c9d2}
  .cal td.sun{color:#c0392b}
  .cal td.out.sun{color:#e6b8b3}
  .cal td.today span{display:inline-block;min-width:20px;border-bottom:2px solid var(--ink)}
  .cal tr.wk{cursor:pointer}
  .cal tr.wk:hover td{background:var(--line2)}
  .cal tr.has td:first-child::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin-left:2px;vertical-align:middle;position:absolute}
  .cal tr.has td:first-child{position:relative}
  .cal tr.sel td{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .cal tr.sel td.out{color:#8fa3c4}
  .cal tr.sel td:first-child{border-radius:6px 0 0 6px}
  .cal tr.sel td:last-child{border-radius:0 6px 6px 0}
  .cal-cap{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .cal-cap b{color:var(--accent);font-weight:600}

  /* 링크 */
  .links{list-style:none;margin:0;padding:0}
  .links li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line2);padding:7px 0}
  .links li:first-child{border-top:0}
  .links a{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .links a:hover{color:var(--accent);text-decoration:underline}
  .links .lk-tools{display:none;gap:0}
  .links li:hover .lk-tools{display:flex}
  .links .lk-tools button{border:0;background:none;cursor:pointer;font-size:11px;color:var(--muted);padding:2px 4px;border-radius:4px}
  .links .lk-tools button:hover{background:var(--line2);color:var(--ink)}
  .links .lk-tools button.del:hover{color:var(--danger)}
  .lk-form{display:flex;flex-direction:column;gap:6px;padding:8px 0}
  .lk-form input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;width:100%}
  .lk-form .row2{display:flex;gap:4px;justify-content:flex-end}
  .lk-empty{font-size:12px;color:var(--muted);padding:6px 0}
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tab{border:0;background:none;padding:8px 14px;border-radius:6px;cursor:pointer;color:var(--ink2)}
  .tab:hover{background:var(--line2)}
  .tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

  main{padding:24px 0 48px}
  .page{display:none}
  .page.on{display:block}

  .btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#c9ced6}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.92}
  .btn.sm{padding:3px 9px;font-size:12px}
  .btn.ghost{border-color:transparent;background:none;color:var(--muted)}
  .btn.ghost:hover{color:var(--ink);background:var(--line2)}
  .btn.danger{color:var(--danger)}
  .btn:disabled{opacity:.45;cursor:default}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  h2{font-size:18px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13px}

  /* input page */
  .in-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .in-grid .card{padding:18px}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .card-h h3{font-size:15px;margin:0}
  textarea#raw{width:100%;min-height:460px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px;line-height:1.6;background:#fcfcfd}
  textarea#raw:focus,input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .editing-bar{display:none;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:16px;align-items:center;justify-content:space-between}
  .editing-bar.on{display:flex}
  .pv-empty{color:var(--muted);padding:40px 0;text-align:center}
  .pv{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
  .pv-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .pv-meta label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
  .pv-meta input,.pv-meta select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
  .pv-meta input.name{width:90px}
  .pv-meta input.num{width:52px}
  .pv-warn{color:var(--danger);font-size:12px;margin-top:6px}
  .pv-exists{font-size:12px;color:#9a6700;margin-top:6px}
  .pv-sec{font-size:12px;color:var(--muted);margin:8px 0 2px}
  .pv ul{margin:0;padding-left:18px}
  .pv li{margin:1px 0}
  .in-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

  /* dashboard */
  .dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .dash-title h1{font-size:24px;margin:0;letter-spacing:-.5px}
  .dash-ctrl{display:flex;gap:6px;align-items:center}
  .dash-ctrl select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;align-items:baseline;justify-content:space-between}
  .stat .k{color:var(--ink2);font-size:13px}
  .stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}

  .board{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row{display:grid;grid-template-columns:130px 1fr 1fr;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row.head{background:#fafbfc;font-size:12px;color:var(--muted);font-weight:600}
  .row.head > div{padding:9px 16px}
  .cell{padding:14px 16px;border-left:1px solid var(--line2);min-width:0}
  .cell:first-child{border-left:0}
  .who{display:flex;flex-direction:column;gap:6px}
  .who .nm{font-weight:700;font-size:15px}
  .who .tools{display:flex;gap:2px;margin-left:-6px}
  .items{list-style:none;margin:0;padding:0}
  .items li{position:relative;padding-left:12px;margin:2px 0;word-break:keep-all;overflow-wrap:anywhere}
  .items li::before{content:"";position:absolute;left:1px;top:.72em;width:4px;height:4px;border-radius:50%;background:#aab1bf}
  .items .subs{list-style:none;padding:0;margin:1px 0 3px}
  .items .subs li{color:var(--ink2);font-size:13px;padding-left:14px}
  .items .subs li::before{content:"ㄴ";background:none;width:auto;height:auto;top:0;left:0;font-size:11px;color:var(--muted)}
  .date{display:inline-block;font-size:11px;line-height:1;padding:3px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:5px;vertical-align:1px;font-variant-numeric:tabular-nums}
  .none{color:var(--muted);font-size:13px}
  .other{grid-column:2 / 4;padding:0 16px 12px;font-size:13px;color:var(--ink2)}
  .other b{font-weight:600;color:var(--muted);margin-right:6px}
  .dash-empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .foot{margin-top:10px;font-size:12px;color:var(--muted);text-align:right}

  /* history */
  .hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  table.hist{width:100%;border-collapse:collapse;background:var(--card)}
  .hist th,.hist td{padding:11px 16px;border-top:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
  .hist thead th{border-top:0;background:#fafbfc;color:var(--muted);font-weight:600;font-size:12px}
  .hist tbody tr{cursor:pointer}
  .hist tbody tr:hover{background:#fafbfc}
  .hist .wk{font-weight:600;font-size:14px}
  .hist .num{font-variant-numeric:tabular-nums}
  .hist .names{color:var(--ink2)}
  .hist .act{text-align:right;white-space:nowrap}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:1180px){
    .layout{grid-template-columns:minmax(0,1fr) 236px}
    .layout #calSide{grid-column:2;grid-row:1}
    .layout #linkSide{grid-column:2;grid-row:2}
    .layout .center{grid-column:1;grid-row:1 / span 2}
    .layout.no-side .center{grid-row:auto}
  }
  @media (max-width:860px){
    .layout,.layout.no-side{grid-template-columns:1fr}
    .layout #calSide,.layout #linkSide,.layout .center{grid-column:auto;grid-row:auto}
    .side{position:static}
    .brand{font-size:22px}
    .in-grid{grid-template-columns:1fr}
    .row{grid-template-columns:1fr}
    .row.head{display:none}
    .cell{border-left:0;border-top:1px solid var(--line2)}
    .cell:first-child{border-top:0}
    .cell[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    .other{grid-column:auto}
    .stats{grid-template-columns:1fr}
    .hist .names,.hist .upd{display:none}
  }

  /* 로그인 */
  .login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .login.on{display:flex}
  .login-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
  .login-box h2{font-size:20px;margin-bottom:2px}
  .login-box input{border:1px solid var(--line);border-radius:8px;padding:9px 12px}
  .login-box .btn{padding:9px 14px;margin-top:4px}
  .lg-err{color:var(--danger);font-size:13px;min-height:18px}
  .who-am{font-size:12px;color:var(--muted)}
  @media (max-width:860px){.who-am{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">복지몰사업팀 주간보고</div>
    <nav class="tabs">
      <button class="tab" data-p="dash">대시보드</button>
      <button class="tab" data-p="input">보고 입력</button>
      <button class="tab" data-p="hist">주차 히스토리</button>
    </nav>
    <span class="who-am" id="whoAm"></span>
    <button class="btn ghost sm" id="logoutBtn">로그아웃</button>
  </div>
</header>

<main class="wrap"><div class="layout" id="layout">
  <aside class="side" id="calSide">
    <div class="panel" id="cal"></div>
  </aside>
  <div class="center">
  <!-- 입력 -->
  <section class="page" id="page-input">
    <div class="editing-bar" id="editBar">
      <span id="editMsg"></span>
      <button class="btn sm" id="editCancel">수정 취소</button>
    </div>
    <div class="in-grid">
      <div class="card">
        <div class="card-h">
          <h3>주간보고 붙여넣기</h3>
          <button class="btn ghost sm" id="clearRaw">지우기</button>
        </div>
        <textarea id="raw" spellcheck="false" placeholder="실장님, 안녕하세요!
복지몰사업팀 OOO입니다.

26년 11월 3주차 주간보고 드립니다.

1. 금주 진행사항
-항목
-항목

2. 차주 진행예정
-항목
-항목

* 여러 명의 보고를 이어서 붙여넣어도 사람별로 나눠서 저장됩니다."></textarea>
      </div>
      <div class="card">
        <div class="card-h">
          <h3>인식 결과</h3>
          <span class="sub" id="pvCount"></span>
        </div>
        <div id="preview"><div class="pv-empty">왼쪽에 주간보고를 붙여넣으면 이름·주차·항목이 자동으로 인식됩니다.</div></div>
        <div class="in-actions">
          <button class="btn primary" id="saveBtn" disabled>저장하고 대시보드 보기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 대시보드 -->
  <section class="page" id="page-dash">
    <div id="dash"></div>
  </section>

  <!-- 히스토리 -->
  <section class="page" id="page-hist">
    <div class="hist-head">
      <div>
        <h2>주차 히스토리</h2>
        <div class="sub">주차를 누르면 해당 주의 대시보드로 이동합니다.</div>
      </div>
    </div>
    <div class="card" style="overflow:hidden" id="hist"></div>
  </section>
  </div>
  <aside class="side" id="linkSide">
    <div class="panel">
      <div class="panel-h"><h3>바로가기</h3><button class="btn ghost sm" id="lkAdd">+ 추가</button></div>
      <div id="links"></div>
    </div>
  </aside>
</div></main>
<div class="login" id="login">
  <form class="login-box" id="lgForm">
    <h2>복지몰사업팀 주간보고</h2>
    <div class="sub">공용 계정으로 로그인하세요.</div>
    <input type="email" id="lgEmail" placeholder="이메일" autocomplete="username" required>
    <input type="password" id="lgPw" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn primary" type="submit">로그인</button>
    <div class="lg-err" id="lgErr"></div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, onSnapshot, deleteDoc, addDoc, updateDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ===== Firebase 설정값 (프로젝트 설정 > 내 앱 > SDK 설정 및 구성) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDZ00kMZf6eXTjnbo-wXRwsSCC1U-ohLT8",
  authDomain: "welfaremall-3a994.firebaseapp.com",
  projectId: "welfaremall-3a994",
  storageBucket: "welfaremall-3a994.firebasestorage.app",
  messagingSenderId: "314501276488",
  appId: "1:314501276488:web:f942e54793e3b1526c897d"
};
/* ================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let db = {weeks:{}, members:[]};
let links = [];
let meta = {members:[], linksSeeded:false};
let ready = {reports:false, links:false, meta:false};
let fs = null, auth = null, unsubs = [];
let currentPage = null;
let firstLoad = true;

const wkId = (y,m,w) => `${y}-${String(m).padStart(2,'0')}-${w}`;
const wkLabel = (y,m,w) => `${String(y).slice(-2)}년 ${m}월 ${w}주차`;
const rid = (weekId, name) => `${weekId}__${name}`;
const sortedWeekIds = () => Object.keys(db.weeks).sort().reverse();
const memberOrder = name => { const i = db.members.indexOf(name); return i < 0 ? 999 : i; };
const sortedReports = wk => Object.values(wk.reports).sort((a,b) => memberOrder(a.name) - memberOrder(b.name));
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fail(e){
  console.error(e);
  const msg = String(e && (e.code || e.message) || e);
  alert(/permission/i.test(msg) ? '권한이 없습니다. 공용 계정으로 로그인했는지, Firestore 보안 규칙이 맞는지 확인해 주세요.' : '저장 중 오류가 발생했습니다.\n' + msg);
}

/* ---------- parser ---------- */
const NAME_RE = /사업팀\s*([가-힣A-Za-z]{2,10}?)\s*(?:입니다|이에요|드림)/;
const WEEK_RE = /(\d{2,4})\s*년\s*(\d{1,2})\s*월\s*(\d)\s*주\s*차/;
const BULLET_RE = /^\s*(?:[-–—·•*▪◦○●]|\d+\s*[\.\)](?=\s*\S))\s*/;
const SUB_RE = /^\s*(?:ㄴ|└|>|→)\s*/;
function sectionKind(title){
  if(/금주|이번\s*주|진행\s*사항|실적/.test(title) && !/차주|다음\s*주|예정/.test(title)) return 'thisWeek';
  if(/차주|다음\s*주|예정|계획/.test(title)) return 'nextWeek';
  return 'other';
}
function parseBlock(text){
  const r = {name:'', year:null, month:null, week:null, thisWeek:[], nextWeek:[], other:[], raw:text.trim()};
  const nm = text.match(NAME_RE); if(nm) r.name = nm[1];
  const wm = text.match(WEEK_RE);
  if(wm){ let y = +wm[1]; if(y < 100) y += 2000; r.year = y; r.month = +wm[2]; r.week = +wm[3]; }
  let cur = null;
  for(const line of text.split(/\r?\n/)){
    const t = line.trim();
    if(!t) continue;
    const sm = t.match(/^(?:\d+\s*[\.\)]|[①-⑩])\s*(.+)$/);
    if(sm && /금주|차주|이번\s*주|다음\s*주|진행|예정|계획|이슈|건의|기타|공유|특이/.test(sm[1]) && sm[1].length <= 20){
      const kind = sectionKind(sm[1]);
      if(kind === 'other'){ cur = {title: sm[1].trim(), items:[]}; r.other.push(cur); }
      else cur = r[kind];
      continue;
    }
    if(!cur) continue;
    const list = Array.isArray(cur) ? cur : cur.items;
    if(SUB_RE.test(t) && list.length){ list[list.length-1].subs.push(t.replace(SUB_RE,'').trim()); continue; }
    if(BULLET_RE.test(t)){ const txt = t.replace(BULLET_RE,'').trim(); if(txt) list.push({text:txt, subs:[]}); continue; }
    if(/안녕하세요|감사합니다|드립니다\.?$|입니다\.?$|^(실장|팀장|본부장)님/.test(t)) { if(/감사합니다/.test(t)) cur = null; continue; }
    list.push({text:t, subs:[]});
  }
  r.other = r.other.filter(o => o.items.length);
  return r;
}
function parseAll(text){
  const lines = text.split(/\r?\n/);
  const starts = [];
  lines.forEach((l,i) => { if(NAME_RE.test(l)) starts.push(i); });
  if(starts.length <= 1) return text.trim() ? [parseBlock(text)] : [];
  const blocks = [];
  starts.forEach((s,k) => {
    let from = s;
    if(s > 0 && /안녕하세요|님,/.test(lines[s-1])) from = s-1;
    if(k === 0) from = 0;
    const to = k+1 < starts.length ? starts[k+1] - (/안녕하세요|님,/.test(lines[starts[k+1]-1]||'') ? 1 : 0) : lines.length;
    blocks.push(lines.slice(from, to).join('\n'));
  });
  const res = blocks.map(parseBlock);
  const base = res.find(r => r.year);
  if(base) res.forEach(r => { if(!r.year){ r.year = base.year; r.month = base.month; r.week = base.week; } });
  return res;
}

function reportDoc(r){

  return {weekId:id, year:r.year, month:r.month, week:r.week, label:wkLabel(r.year,r.month,r.week),
    name:r.name, thisWeek:r.thisWeek, nextWeek:r.nextWeek, other:r.other, raw:r.raw,
    updatedAt:stamp(), updatedBy:(auth.currentUser && auth.currentUser.email) || ''};
}
async function writeReports(list, old){
  const b = writeBatch(fs);
  if(old) b.delete(doc(fs, 'reports', rid(old.weekId, old.name)));
  list.forEach(r => b.set(doc(fs, 'reports', rid(wkId(r.year,r.month,r.week), r.name)), reportDoc(r)));
  const add = [...new Set(list.map(r => r.name))].filter(n => !meta.members.includes(n));
  if(add.length) b.set(doc(fs, 'meta', 'team'), {members:[...meta.members, ...add]}, {merge:true});
  await b.commit();
}

function itemHTML(it){
  let text = it.text, date = '';
  const m = text.match(DATE_RE);
  if(m && m.index > 0){ date = m[1].replace(/\s+/g,''); text = text.slice(0, m.index).trim(); }
  const subs = it.subs && it.subs.length ? `<ul class="subs">${it.subs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>` : '';
  return `<li>${esc(text)}${date ? `<span class="date">${esc(date)}</span>` : ''}${subs}</li>`;
}

/* ---------- 달력 (주차: 월~일, 목요일이 속한 달의 N번째 주) ---------- */
const DOW = ['월','화','수','목','금','토','일'];
function weekOfDate(dt){
  const mon = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - ((dt.getDay()+6)%7));
  const thu = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+3);
  return {y:thu.getFullYear(), m:thu.getMonth()+1, w:Math.ceil(thu.getDate()/7), mon};
}
function weekStart(y,m,w){
  const first = new Date(y, m-1, 1), dow = (first.getDay()+6)%7;
  const start1 = dow > 3 ? 8 - dow : 1 - dow;
  return new Date(y, m-1, start1 + 7*(w-1));
}
let calY, calM;
function calFollow(){
  const wk = curWeek && db.weeks[curWeek];
  if(wk){ calY = wk.year; calM = wk.month; } else { const o = weekOfDate(new Date()); calY = o.y; calM = o.m; }
}
function renderCal(){
  if(calY == null) calFollow();
  const md = d => `${d.getMonth()+1}/${d.getDate()}`;
  let mon = weekStart(calY, calM, 1);
  const today = new Date(); today.setHours(0,0,0,0);
  let rows = '';
  for(let w = 1; w <= 6; w++){
    const o = weekOfDate(mon);
    if(o.m !== calM || o.y !== calY) break;
    const id = wkId(o.y, o.m, o.w);
    const cls = ['wk', db.weeks[id] ? 'has' : '', id === curWeek ? 'sel' : ''].join(' ');
    let tds = '';
    for(let i = 0; i < 7; i++){
      const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i);
      const c = [d.getMonth()+1 !== calM ? 'out' : '', i === 6 ? 'sun' : '', +d === +today ? 'today' : ''].join(' ');
      tds += `<td class="${c}"><span>${d.getDate()}</span></td>`;
    }
    rows += `<tr class="${cls}" data-wk="${id}" title="${o.m}월 ${o.w}주차">${tds}</tr>`;
    mon = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+7);
  }
  let cap = '';
  const wk = curWeek && db.weeks[curWeek];
  if(wk){
    const s = weekStart(wk.year, wk.month, wk.week), e = new Date(s.getFullYear(), s.getMonth(), s.getDate()+6);
    cap = `<div class="cal-cap"><b>${wk.month}월 ${wk.week}주차</b> · ${md(s)}(월) ~ ${md(e)}(일)<br>점 표시: 보고가 등록된 주</div>`;
  }
  $('#cal').innerHTML = `
    <div class="cal-nav"><button id="calPrev" title="이전 달">‹</button><b>${calY}년 ${calM}월</b><button id="calNext" title="다음 달">›</button></div>
    <table class="cal"><thead><tr>${DOW.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>${cap}`;
  $('#calPrev').onclick = () => { calM--; if(calM < 1){ calM = 12; calY--; } renderCal(); };
  $('#calNext').onclick = () => { calM++; if(calM > 12){ calM = 1; calY++; } renderCal(); };
  $('#cal').querySelectorAll('tr.wk').forEach(tr => tr.onclick = () => {
    const id = tr.dataset.wk;
    if(!db.weeks[id]){ toast(`${tr.title} 보고가 아직 없습니다.`); return; }
    curWeek = id; go('dash');
  });
}

});
$('#raw').addEventListener('input', renderPreview);
$('#clearRaw').onclick = () => { $('#raw').value = ''; renderPreview(); };
$('#saveBtn').onclick = doSave;
$('#editCancel').onclick = () => { exitEdit(); $('#raw').value = ''; renderPreview(); go('dash'); };

/* ---------- 실시간 구독 ---------- */
function subscribe(){
  unsubs.push(onSnapshot(collection(fs, 'reports'), snap => {
    const weeks = {};
    snap.forEach(d => {
      const r = d.data();
      if(!weeks[r.weekId]) weeks[r.weekId] = {year:r.year, month:r.month, week:r.week, label:r.label, reports:{}};
      weeks[r.weekId].reports[r.name] = r;
    });
    db.weeks = weeks;
    ready.reports = true;
    if(firstLoad){ firstLoad = false; go(sortedWeekIds().length ? 'dash' : 'input'); migrateLocal(); }
    else refresh();
  }, fail));
  unsubs.push(onSnapshot(doc(fs, 'meta', 'team'), snap => {
    meta = Object.assign({members:[], linksSeeded:false}, snap.exists() ? snap.data() : {});
    db.members = meta.members;
    ready.meta = true;
    seedLinks();
    if(ready.reports) refresh();
  }, fail));
  unsubs.push(onSnapshot(collection(fs, 'links'), snap => {
    links = [];
    snap.forEach(d => links.push({id:d.id, ...d.data()}));
    links.sort((a,b) => (a.order||0) - (b.order||0));
    ready.links = true;
    seedLinks();
    if(lkEdit === null) renderLinks();
  }, fail));
}
let seeding = false;
function seedLinks(){
  if(!ready.meta || !ready.links || meta.linksSeeded || seeding) return;
  seeding = true;
  const b = writeBatch(fs);
  if(!links.length) DEFAULT_LINKS.forEach((l,i) => b.set(doc(collection(fs, 'links')), {...l, order:i+1}));
  b.set(doc(fs, 'meta', 'team'), {linksSeeded:true}, {merge:true});
  b.commit().catch(fail).finally(() => { seeding = false; });
}
// 이 브라우저에 예전(로컬 저장) 버전으로 쌓인 기록이 있으면 한 번 옮길지 묻는다
function migrateLocal(){
  let old;
  try{
    if(localStorage.getItem('welfare-weekly-migrated')) return;
    old = JSON.parse(localStorage.getItem('welfare-weekly-report-v1'));
  }catch(e){ return; }
  if(!old || !old.weeks) return;
  const list = [];
  Object.values(old.weeks).forEach(w => Object.values(w.reports).forEach(r => {
    if(!(db.weeks[wkId(w.year,w.month,w.week)] && db.weeks[wkId(w.year,w.month,w.week)].reports[r.name]))
      list.push({...r, year:w.year, month:w.month, week:w.week, other:r.other||[], raw:r.raw||''});
  }));
  const done = () => { try{ localStorage.setItem('welfare-weekly-migrated', '1'); }catch(e){} };
  if(!list.length){ done(); return; }
  if(!confirm(`이 브라우저에 예전에 입력한 보고 ${list.length}건이 있습니다. 공용 DB로 옮길까요?`)){ done(); return; }
  writeReports(list, null).then(() => { done(); toast(`${list.length}건 옮겼습니다.`); }).catch(fail);
}

/* ---------- 로그인 ---------- */
function showLogin(msg){
  $('#login').classList.add('on');
  $('#lgErr').textContent = msg || '';
}
if(!firebaseConfig.apiKey){
  showLogin('Firebase 설정값이 아직 입력되지 않았습니다.');
  $('#lgForm').querySelectorAll('input,button').forEach(x => x.disabled = true);
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  fs = getFirestore(app);
  onAuthStateChanged(auth, user => {
    unsubs.forEach(u => u()); unsubs = [];
    if(!user){
      ready = {reports:false, links:false, meta:false}; firstLoad = true;
      $('#whoAm').textContent = '';
      showLogin();
      return;
    }
    $('#login').classList.remove('on');
    $('#whoAm').textContent = user.email;
    subscribe();
  });
  $('#lgForm').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true; $('#lgErr').textContent = '';
    try{ await signInWithEmailAndPassword(auth, $('#lgEmail').value.trim(), $('#lgPw').value); $('#lgPw').value = ''; }
    catch(err){ $('#lgErr').textContent = '이메일 또는 비밀번호가 맞지 않습니다.'; }
    btn.disabled = false;
  };
  $('#logoutBtn').onclick = () => { if(confirm('로그아웃할까요?')) signOut(auth); };
}
</script>
